services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-wa-automatization:prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_PATH: /app/data/leads.sqlite3
      TELEGRAM_SESSION_NAME: /app/sessions/userbot
      WHATSAPP_SERVICE_URL: http://whatsapp:3000
    ports:
      - "8000:8000"
    volumes:
      - lead_data:/app/data
      - telegram_sessions:/app/sessions
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    image: tg-wa-automatization-whatsapp:prod
    init: true
    restart: unless-stopped
    profiles:
      - whatsapp
    env_file:
      - .env
    environment:
      PORT: 3000
      WHATSAPP_SESSION_PATH: /app/session
    volumes:
      - whatsapp_sessions:/app/session
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lead_data:
  telegram_sessions:
  whatsapp_sessions:
