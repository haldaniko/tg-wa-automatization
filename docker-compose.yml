services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-wa-automatization:prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_PATH: /app/data/leads.sqlite3
      TELEGRAM_SESSION_NAME: /app/sessions/userbot
    ports:
      - "8000:8000"
    volumes:
      - lead_data:/app/data
      - telegram_sessions:/app/sessions
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  lead_data:
  telegram_sessions:
